name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # VibeKit shells out to git and to CLIs that are .cmd shims on Windows, and its tests
    # write real temp projects and run real commands. Those differences are exactly where it has
    # broken before, so every supported OS runs the suite rather than one standing in for the rest.
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git (the tests create commits)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Integration tests
        working-directory: plugin
        run: npm test

  flake:
    # The matrix above proves the suite passes once. This proves it passes repeatedly, which is a
    # different claim: the races this suite has actually hit only appear when runs compete for
    # I/O, and they showed up on Windows first. Ubuntu is here as the cheap control.
    name: repeat runs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git (the tests create commits)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run the suite three times
        working-directory: plugin
        run: npm run test:repeat

  validate:
    name: plugin validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude Code plugin validator
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate plugin
